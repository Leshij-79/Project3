
{% extends 'base.html' %}
{% load tag_filter %}
{% block title %}Создание поста{% endblock %}

{% block content %}

    <div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
        <h1 class="display-4">Блог</h1>
        <p class="lead">Создание пост</p>
    </div>

    <div class="container">
        <div class="col-1">
        </div>
        <div class="col-12">
            <div class="row text-center">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Сохранить</button>
                <a role="button" class="btn btn-secondary" href="{% url 'blog:blog_list' %}">Назад</a>
            </div>
        </div>
        <div class="col-1">
        </div>
        {% include 'footer.html' %}
    </div>

{% endblock %}
