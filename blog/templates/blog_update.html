
{% extends 'base.html' %}
{% load tag_filter %}
{% block title %}Редактирование поста{% endblock %}

{% block content %}

    <div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
        <h1 class="display-4">Блог</h1>
        <p class="lead">Редактирование блога</p>
    </div>

    <div class="container">
        <div class="col-1">
        </div>
        <div class="col-12">
            <div class="row text-center">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                    <a role="button" class="btn btn-secondary" href="{% url 'blog:blog_detail' blog.pk %}">Назад</a>
                </form>
            </div>
        </div>
        <div class="col-1">
        </div>
        {% include 'footer.html' %}
    </div>

{% endblock %}
