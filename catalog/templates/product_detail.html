
{% extends 'base.html' %}
{% load tag_filter %}
{% block title %}Магазин - {{ product.name }}{% endblock %}

{% block content %}

    <div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
        <h1 class="display-4">Магазин</h1>
        <p class="lead">Категория {{ product.category }}</p>
    </div>

    <div class="container">
        <div class="row text-center">
            <img src="{{ product.photo_product | media_filter }}">
            <h1 class="my-0 font-weight-normal">{{ product.name }}</h1>
            <h2>{{ product.description }}</h2>
            <h3 class="card-title pricing-card-title">{{ product.price }}</h3>
            <a role="button" class="btn btn-lg btn-block btn-outline-primary" href="{% url 'catalog:home' %}">Назад</a>
        </div>
        {% include 'footer.html' %}
    </div>

{% endblock %}
